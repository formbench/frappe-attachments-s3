[project]
name = "frappe_s3_attachment"
authors = [
    { name = "Frappe", email = "ramesh.ravi@zerodha.com" }
]
description = "Frappe app to make file upload to S3 through attach file option."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # bundled with frappe v15, no longer with v16
    "boto3>=1.34",
    "botocore",
    # needs the libmagic system library, which Frappe Cloud images install for this app
    "python-magic~=0.4.18",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud refuses to add the app to a bench without this section
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
